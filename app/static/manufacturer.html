<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liftorg — кабинет производителя</title><link rel="stylesheet" href="/static/style.css"><style>
body{background:#f4f7fa;color:#13263a}.wrap{max-width:1300px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}.head h1{margin:0}.panel{background:#fff;border:1px solid #dae4eb;border-radius:16px;padding:16px;margin-top:18px}.toolbar{display:flex;gap:8px}.toolbar input{flex:1;padding:11px;border:1px solid #ccd8e2;border-radius:9px}.btn{border:0;background:#e84b32;color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f4;text-align:left}.table input,.table select{padding:8px;border:1px solid #ccd8e2;border-radius:7px;max-width:160px}.muted{color:#718394;font-size:12px}@media(max-width:800px){.table{min-width:900px}.scroll{overflow:auto}}
</style></head><body><div class="wrap"><div class="head"><div><h1>Кабинет производителя</h1><div id="who" class="muted">Загрузка…</div></div><a href="/" class="btn" style="text-decoration:none">Открыть подбор</a></div><div class="panel"><div class="toolbar"><input id="q" placeholder="Поиск модели / ID"><button class="btn" onclick="load()">Найти</button></div><div id="count" class="muted"></div><div class="scroll"><table class="table"><thead><tr><th>Модель</th><th>ID</th><th>Г/п</th><th>Скорость</th><th>Отпускная цена</th><th>Валюта</th><th>Комментарий</th><th>Обновлено</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="panel"><h2>Запросы инженеров</h2><div class="muted">Опросные листы по вашей номенклатуре</div><div id="inqs" style="margin-top:10px"></div></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function load(){const d=await fetch('/api/manufacturer/products?q='+encodeURIComponent(q.value)).then(r=>r.json());who.textContent='Производитель: '+d.manufacturer;count.textContent='Позиций: '+d.total;rows.innerHTML=d.items.map(x=>`<tr><td><b>${esc(x.model)}</b></td><td>${esc(x.identification_number||'—')}</td><td>${x.capacity_kg??'—'} кг</td><td>${x.speed_m_s??'—'} м/с</td><td><input id="p${x.id}" type="number" step="0.01" value="${x.manufacturer_price_cny??''}"></td><td><select id="c${x.id}">${['CNY','USD','EUR','RUB'].map(c=>`<option ${c===(x.manufacturer_currency||'CNY')?'selected':''}>${c}</option>`).join('')}</select></td><td><input id="n${x.id}" value="${esc(x.manufacturer_price_note||'')}"></td><td class="muted">${esc(x.manufacturer_price_updated_at||'—')}</td><td><button class="btn" onclick="save(${x.id})">Сохранить</button></td></tr>`).join('')}
async function save(id){const body={price:document.getElementById('p'+id).value?+document.getElementById('p'+id).value:null,currency:document.getElementById('c'+id).value,note:document.getElementById('n'+id).value};const r=await fetch('/api/manufacturer/products/'+id+'/price',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert('Ошибка сохранения');return}await load()}
async function loadInquiries(){const d=await fetch('/api/manufacturer/inquiries').then(r=>r.json());inqs.innerHTML=d.items.map(x=>`<details style="border-bottom:1px solid #edf1f4;padding:10px 0"><summary style="cursor:pointer;font-weight:800" onclick="loadInquiry(${x.id},this.parentElement)">${esc(x.number)} · ${esc(x.model)} · ${esc(x.company)}</summary><div class="muted">${esc(x.created_at)} · ${esc(x.status)}</div><div class="inqbody"></div></details>`).join('')||'<div class="muted">Запросов пока нет</div>'}
async function loadInquiry(id,box){const d=await fetch('/api/manufacturer/inquiries/'+id).then(r=>r.json());box.querySelector('.inqbody').innerHTML=Object.entries(d.answers||{}).filter(([,v])=>v!==''&&v!==false).map(([k,v])=>`<div style="padding:5px 0"><small class="muted">${esc(k)}</small><br><b>${esc(v)}</b></div>`).join('')}
q.addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();loadInquiries();
</script></body></html>

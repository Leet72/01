<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liftorg — характеристики</title><style>
body{font-family:Inter,Arial,sans-serif;margin:0;background:#f5f7f8;color:#0b2235}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.card{background:#fff;border:1px solid #dbe4ea;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}label{font-size:12px;font-weight:700;color:#5f7180;display:flex;flex-direction:column;gap:6px}input,select,textarea{padding:10px;border:1px solid #cbd8e1;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:#ef533d;color:#fff}.ghost{background:#eef3f6}.row{display:grid;grid-template-columns:1.2fr 1.5fr .8fr .8fr 1.2fr 1fr 160px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1f4}.small{font-size:12px;color:#6a7d8b}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{flex-direction:row;align-items:center;font-size:12px}.product-tools{display:flex;gap:8px;align-items:end}.values{margin-top:12px}.value-row{display:grid;grid-template-columns:1fr 1fr 120px;gap:10px;align-items:center;margin:8px 0}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.product-tools{flex-wrap:wrap}} </style></head><body><div class="wrap">
<div class="top"><div><div class="small">LIFTORG B2B</div><h1>Конструктор характеристик</h1></div><div><a href="/admin">← Каталог</a> · <a href="/admin/audit">Аудит</a></div></div>
<div class="card"><h2>Новая характеристика</h2><div class="grid">
<label>Код<input id="code" placeholder="cooling_type"></label><label>Название<input id="name" placeholder="Тип охлаждения"></label><label>Тип данных<select id="data_type"><option>text</option><option>number</option><option>integer</option><option>boolean</option><option>enum</option><option>multienum</option><option>range</option></select></label><label>Единица<input id="unit" placeholder="кВт / мм / ..."></label>
<label>Логика фильтра<select id="filter_type"><option>exact</option><option>range</option><option>max</option><option>min</option><option>enum</option><option>multienum</option><option>boolean</option><option>reference</option></select></label><label style="grid-column:span 2">Варианты (через запятую)<input id="options" placeholder="Да, Нет"></label><label>Сортировка<input id="sort_order" type="number" value="500"></label></div>
<div class="checks" style="margin:14px 0"><label><input type="checkbox" id="is_filterable"> участвует в фильтре</label><label><input type="checkbox" id="is_card_visible"> в карточке</label><label><input type="checkbox" id="is_compare_visible"> в сравнении</label><label><input type="checkbox" id="is_required"> обязательный</label></div><button class="primary" onclick="createAttr()">Добавить характеристику</button></div>
<div class="card"><h2>Справочник характеристик</h2><div id="attrs"></div></div>
<div class="card"><h2>Значения у конкретной лебёдки</h2><div class="product-tools"><label>ID товара<input id="productId" type="number" value="1"></label><button class="ghost" onclick="loadValues()">Загрузить поля</button></div><div id="values" class="values"></div></div>
</div><script>
async function api(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
async function load(){const d=await api('/api/admin/attributes');document.getElementById('attrs').innerHTML=d.items.length?d.items.map(a=>`<div class="row"><b>${esc(a.name)}</b><code>${esc(a.code)}</code><span>${esc(a.data_type)}</span><span>${esc(a.unit||'—')}</span><span>${esc(a.filter_type)}</span><span class="small">${a.is_filterable?'фильтр ':''}${a.is_card_visible?'карточка ':''}${a.is_compare_visible?'сравнение':''}</span><button onclick="delAttr(${a.id})">Удалить</button></div>`).join(''):'<p>Пока нет пользовательских характеристик.</p>'}
async function createAttr(){const body={code:code.value,name:name.value,data_type:data_type.value,unit:unit.value||null,filter_type:filter_type.value,options:options.value.split(',').map(x=>x.trim()).filter(Boolean),is_filterable:is_filterable.checked,is_card_visible:is_card_visible.checked,is_compare_visible:is_compare_visible.checked,is_required:is_required.checked,sort_order:+sort_order.value||500};await api('/api/admin/attributes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});code.value='';name.value='';load()}
async function delAttr(id){if(confirm('Удалить характеристику и её значения?')){await api('/api/admin/attributes/'+id,{method:'DELETE'});load();loadValues()}}
async function loadValues(){const id=+productId.value;if(!id)return;const d=await api(`/api/admin/products/${id}/attributes`);values.innerHTML=d.items.length?d.items.map(x=>`<div class="value-row"><div><b>${esc(x.attribute.name)}</b><div class="small">${esc(x.attribute.code)} · ${esc(x.attribute.unit||'')}</div></div><input id="val_${x.attribute.id}" value='${esc(typeof x.value==='string'?x.value:JSON.stringify(x.value??''))}'><button onclick="saveVal(${id},${x.attribute.id})">Сохранить</button></div>`).join(''):'<p>Сначала создайте характеристику.</p>'}
async function saveVal(pid,aid){let v=document.getElementById('val_'+aid).value;try{if(v.startsWith('[')||v.startsWith('{'))v=JSON.parse(v)}catch(e){}await api(`/api/admin/products/${pid}/attributes/${aid}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({value:v})});alert('Сохранено')}
load();</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liftorg — аудит исходников</title><link rel="stylesheet" href="/static/style.css"><style>body{background:#f4f7fa;color:#13263a}.wrap{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.btn{padding:10px 14px;border-radius:9px;border:1px solid #ccd8e2;background:#fff;color:#23384d;text-decoration:none;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.panel{background:#fff;border:1px solid #d9e2ea;border-radius:14px;padding:15px}.num{font-size:28px;font-weight:900}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:8px;border-bottom:1px solid #edf1f4;text-align:left;vertical-align:top}.ok{color:#16834b;font-weight:800}.warn{color:#b16b00;font-weight:800}.sheets button{display:block;width:100%;text-align:left;padding:9px;margin:4px 0;border:1px solid #e2e8ee;background:#fff;border-radius:8px;cursor:pointer}.src{max-height:68vh;overflow:auto;font-family:monospace;font-size:12px;white-space:pre-wrap;background:#fbfcfd;padding:12px;border-radius:10px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="head"><div><h1>Аудит исходных файлов</h1><div>Каждое исходное поле: куда оно попало и используется ли в подборе.</div></div><div><a class="btn" href="/admin">← Админка</a> <a class="btn" href="/">Подбор</a></div></div><div class="cards" id="cards"></div><div class="grid"><div class="panel"><h2>Карта товарных полей</h2><div style="max-height:70vh;overflow:auto"><table class="table"><thead><tr><th>Поле Excel</th><th>Поле БД</th><th>Использование</th><th>Заполнено</th><th>Статус</th></tr></thead><tbody id="fields"></tbody></table></div></div><div class="panel"><h2>Вспомогательные листы</h2><div class="sheets" id="sheets"></div><h3 id="sheetTitle"></h3><div class="src" id="source">Выберите лист</div></div></div></div><script>function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function init(){let r=await fetch('/api/admin/audit');let d=await r.json();document.getElementById('cards').innerHTML=`<div class="card"><div class="num">${d.products_total}</div>позиций в БД</div><div class="card"><div class="num">${d.raw_fields_total}</div>исходных полей</div><div class="card"><div class="num">${d.mapped_fields}</div>нормализовано</div><div class="card"><div class="num">${d.raw_only_fields}</div>требуют решения</div>`;document.getElementById('fields').innerHTML=d.fields.map(x=>`<tr><td><b>${esc(x.source_field)}</b></td><td>${esc(x.db_field||'—')}</td><td>${esc(x.usage)}</td><td>${x.filled_products}</td><td class="${x.status==='mapped'?'ok':'warn'}">${x.status==='mapped'?'Учтено':'Raw'}</td></tr>`).join('');document.getElementById('sheets').innerHTML=d.source_sheets.map(x=>`<button data-name="${esc(x.name)}">${esc(x.name)} <small>(${x.rows} строк)</small></button>`).join('');document.querySelectorAll('.sheets button').forEach(b=>b.onclick=()=>openSheet(b.dataset.name))}async function openSheet(n){let r=await fetch('/api/admin/source-sheet?name='+encodeURIComponent(n));let d=await r.json();document.getElementById('sheetTitle').textContent=d.name;document.getElementById('source').textContent=d.rows.map(x=>`${x[0]}: ${JSON.stringify(x[1])}`).join('\n')}init();</script></body></html>

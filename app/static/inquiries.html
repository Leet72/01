<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liftorg — запросы цены</title><link rel="stylesheet" href="/static/style.css"><style>
body{background:#f4f7fa;color:#13263a}.adm{max-width:1500px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.head h1{margin:0;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #ccd8e2;background:#fff;border-radius:10px;padding:10px 14px;font-weight:800;color:#23384d;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:minmax(420px,.85fr) minmax(520px,1.35fr);gap:18px}.panel{background:#fff;border:1px solid #d9e2ea;border-radius:16px;padding:16px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select{padding:10px;border:1px solid #ccd8e2;border-radius:8px}.toolbar input{flex:1}.list{max-height:75vh;overflow:auto}.item{padding:12px;border-bottom:1px solid #edf1f4;cursor:pointer}.item:hover{background:#f7fafc}.item b{display:block}.item small{color:#738596}.status{display:inline-block;margin-top:6px;padding:3px 7px;border-radius:999px;background:#eef3f6;font-size:12px}.detail h2{margin-top:0}.kv{display:grid;grid-template-columns:180px 1fr;gap:7px 12px;font-size:14px}.kv dt{color:#6f8191}.kv dd{margin:0;font-weight:700}.answers{margin-top:18px}.answer{padding:9px 0;border-bottom:1px solid #edf1f4}.answer small{display:block;color:#728493}.statusbar{display:flex;gap:8px;margin:12px 0}.statusbar select{padding:9px;border:1px solid #ccd8e2;border-radius:8px}.statusbar button{border:0;background:#e84b32;color:#fff;padding:9px 13px;border-radius:8px;font-weight:800}.empty{color:#718394;padding:30px;text-align:center}@media(max-width:900px){.grid{grid-template-columns:1fr}.list{max-height:42vh}.kv{grid-template-columns:1fr}}
</style></head><body><div class="adm"><div class="head"><div><h1>Запросы цены</h1><div style="color:#718394">Опросные листы инженеров после технического подбора</div></div><div class="actions"><a class="btn" href="/admin">Каталог</a><a class="btn" href="/admin/audit">Аудит</a><a class="btn" href="/">Подбор</a></div></div><div class="grid"><div class="panel"><div class="toolbar"><input id="q" placeholder="№ запроса, модель, компания"><select id="status"><option value="">Все статусы</option><option value="new">Новый</option><option value="in_review">В работе</option><option value="sent_to_manufacturer">Отправлен производителю</option><option value="quoted">Цена получена</option><option value="closed">Закрыт</option><option value="cancelled">Отменён</option></select><button class="btn" onclick="load()">Найти</button></div><div id="count"></div><div id="list" class="list"></div></div><div class="panel detail" id="detail"><div class="empty">Выберите запрос слева</div></div></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={new:'Новый',in_review:'В работе',sent_to_manufacturer:'Отправлен производителю',quoted:'Цена получена',closed:'Закрыт',cancelled:'Отменён'};
async function load(){let u='/api/admin/inquiries?limit=300';if(q.value)u+='&q='+encodeURIComponent(q.value);if(status.value)u+='&status='+encodeURIComponent(status.value);const d=await fetch(u).then(r=>r.json());count.textContent='Найдено: '+d.total;list.innerHTML=d.items.map(x=>`<div class="item" onclick="show(${x.id})"><b>${esc(x.number)} · ${esc(x.manufacturer)} ${esc(x.model)}</b><small>${esc(x.created_at)}</small><span class="status">${labels[x.status]||x.status}</span></div>`).join('')||'<div class="empty">Запросов пока нет</div>'}
async function show(id){const d=await fetch('/api/admin/inquiries/'+id).then(r=>r.json());const ans=Object.entries(d.answers||{}).filter(([,v])=>v!==null&&v!==''&&v!==false).map(([k,v])=>`<div class="answer"><small>${esc(k)}</small><b>${esc(Array.isArray(v)?v.join(', '):v)}</b></div>`).join('');detail.innerHTML=`<h2>${esc(d.number)}</h2><div class="statusbar"><select id="st">${Object.entries(labels).map(([v,l])=>`<option value="${v}" ${v===d.status?'selected':''}>${l}</option>`).join('')}</select><button onclick="setStatus(${id})">Сохранить статус</button></div><dl class="kv"><dt>Производитель</dt><dd>${esc(d.manufacturer)}</dd><dt>Модель</dt><dd>${esc(d.model)}</dd><dt>Создан</dt><dd>${esc(d.created_at)}</dd><dt>Фильтры</dt><dd>${esc(Object.entries(d.filters||{}).filter(([,v])=>v).map(([k,v])=>k+': '+v).join(' · '))}</dd></dl><h3>Опросный лист</h3><div class="answers">${ans||'Нет заполненных полей'}</div>`}
async function setStatus(id){await fetch('/api/admin/inquiries/'+id+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:st.value})});await show(id);await load()}
q.addEventListener('keydown',e=>{if(e.key==='Enter')load()});load();
</script></body></html>
